name: json2dart_studio
description: "Yerel çalışan JSON → Dart model üretici ve JSON görüntüleyici (Windows/macOS masaüstü)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  shared_preferences: ^2.5.5
  dart_style: ^3.1.9
  file_picker: ^11.0.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true